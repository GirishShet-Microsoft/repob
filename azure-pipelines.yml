trigger:
- main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps: 
- script: | 
    echo "Pipeline triggered successfully" 
    echo "Build.SourceVersionMessage:" 
    echo "$(Build.SourceVersionMessage)" 
  displayName: Test Pipeline
